spring:
  application:
    name: securities-position-risk-platform
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:markets;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  risk:
    absolute-notional-limit: ${ABSOLUTE_NOTIONAL_LIMIT:1000000}
  messaging:
    kafka-enabled: ${KAFKA_ENABLED:false}
    topic: execution-events-v1
    maximum-attempts: 5
  cache:
    redis-enabled: ${REDIS_ENABLED:false}
  web:
    allowed-origin: ${WEB_ALLOWED_ORIGIN:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

