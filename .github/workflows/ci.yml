name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify Java service
        run: mvn --batch-mode verify
      - name: Smoke executable service package
        run: |
          java -jar backend/target/backend-0.1.0.jar --server.port=18080 > /tmp/market-package.log 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:18080/actuator/health/readiness; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/market-package.log
          exit 1

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
      - name: Terraform format
        run: terraform -chdir=infra/aws fmt -check
      - name: Terraform initialize
        run: terraform -chdir=infra/aws init -backend=false
      - name: Terraform validate
        run: terraform -chdir=infra/aws validate
      - name: Kubernetes manifest shape
        run: |
          grep -R "kind: Deployment" deploy/kubernetes
          grep -R "readinessProbe" deploy/kubernetes
      - name: Compose model
        run: docker compose config --quiet

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t market-risk-backend:test .
      - name: Build web image
        run: docker build -f web/Dockerfile -t market-risk-web:test .

