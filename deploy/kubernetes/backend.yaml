apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-risk-backend
  labels:
    app.kubernetes.io/name: market-risk-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: market-risk-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: market-risk-backend
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: backend
          image: ghcr.io/pthanureddy/securities-position-risk-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: market-risk-secrets
                  key: database-url
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: market-risk-secrets
                  key: database-username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: market-risk-secrets
                  key: database-password
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: market-risk-secrets
                  key: kafka-bootstrap-servers
            - name: KAFKA_ENABLED
              value: "true"
            - name: REDIS_ENABLED
              value: "true"
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: market-risk-secrets
                  key: redis-host
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: market-risk-backend
spec:
  selector:
    app.kubernetes.io/name: market-risk-backend
  ports:
    - name: http
      port: 8080
      targetPort: http

