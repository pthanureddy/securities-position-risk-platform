apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-risk-web
  labels:
    app.kubernetes.io/name: market-risk-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: market-risk-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: market-risk-web
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: web
          image: ghcr.io/pthanureddy/securities-position-risk-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: market-risk-web
spec:
  selector:
    app.kubernetes.io/name: market-risk-web
  ports:
    - name: http
      port: 80
      targetPort: http

